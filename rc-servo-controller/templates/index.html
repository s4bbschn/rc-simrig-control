<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RC Servo Controller</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #111827; color: #e5e7eb; padding: 12px; }
.wrap { max-width: 820px; margin: 0 auto; }
h1 { text-align: center; color: #38bdf8; margin-bottom: 16px; font-size: 1.3em; }
h2 { color: #38bdf8; font-size: 1em; margin-bottom: 10px; }

.card { background: #1e293b; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
label { display: block; font-size: 0.82em; color: #94a3b8; margin: 8px 0 3px; }
select, input[type=number] {
  width: 100%; padding: 7px; border-radius: 5px; border: 1px solid #334155;
  background: #0f172a; color: #e5e7eb; font-size: 0.88em;
}
input[type=range] { width: 100%; margin-top: 3px; accent-color: #38bdf8; }
button {
  background: #1e40af; color: #93c5fd; border: 1px solid #3b82f6; padding: 7px 14px;
  border-radius: 5px; cursor: pointer; font-size: 0.88em; margin-top: 8px;
}
button:hover { background: #2563eb; }
.btn-save { background: #38bdf8; color: #0f172a; font-weight: 600; width: 100%; padding: 10px; }

.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rng { display: flex; align-items: center; gap: 8px; }
.rng input { flex: 1; }
.rng .v { min-width: 44px; text-align: right; font-size: 0.82em; color: #38bdf8; }
.chk { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.chk input { width: auto; }

/* Achsen-Monitor */
.axes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px; }
.ax { background: #0f172a; border-radius: 5px; padding: 5px 8px; font-size: 0.78em; border: 1px solid #1e293b; }
.ax .name { color: #94a3b8; }
.ax .val { color: #38bdf8; float: right; }
.ax .track { height: 6px; background: #1e293b; border-radius: 3px; margin-top: 4px; position: relative; }
.ax .mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: #475569; }
.ax .fill { position: absolute; height: 100%; border-radius: 3px; transition: left .06s, width .06s; }
.ax .cur { position: absolute; top: -2px; width: 3px; height: 10px; background: #fff;
  border-radius: 1px; transform: translateX(-50%); transition: left .06s; }

/* Servo-Output Anzeige */
.servo-out { margin-top: 8px; }
.servo-nums { display: flex; justify-content: space-between; font-size: 0.78em; color: #94a3b8; margin-bottom: 4px; }
.servo-nums span { color: #38bdf8; font-weight: 600; }
.servo-track { height: 16px; background: #0f172a; border-radius: 5px; position: relative; border: 1px solid #334155; }
.servo-track .mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: #475569; transform: translateX(-50%); }
.servo-track .fill { position: absolute; height: 100%; border-radius: 4px; opacity: .8; transition: left .06s, width .06s; }

.status { text-align: center; padding: 6px; color: #4ade80; font-size: 0.82em; min-height: 26px; }
.no-data { color: #475569; font-style: italic; font-size: 0.85em; }
</style>
</head>
<body>
<div class="wrap">
<h1>🏎️ RC Servo Controller</h1>

<!-- Gerät -->
<div class="card">
  <h2>📡 Lenkrad</h2>
  <select id="sel-device"><option value="">— Lenkrad wählen —</option></select>
  <button onclick="scanDevices()">Geräte scannen</button>
</div>

<!-- Achsen-Monitor -->
<div class="card">
  <h2>📊 Achsen (Live)</h2>
  <div id="axes-mon" class="axes-grid"><span class="no-data">Kein Gerät</span></div>
</div>

<!-- Steering -->
<div class="card">
  <h2>🔄 Lenkung</h2>
  <label>Achse</label>
  <select id="st-axis"><option value="">—</option></select>

  <div class="row2">
    <div><label>GPIO</label><input type="number" id="st-gpio" value="18" min="0" max="27"></div>
    <div><label>Center (µs)</label><input type="number" id="st-center" value="1450"></div>
  </div>
  <div class="row2">
    <div><label>Min (µs)</label><input type="number" id="st-minp" value="500"></div>
    <div><label>Max (µs)</label><input type="number" id="st-maxp" value="2400"></div>
  </div>

  <label>Trim</label>
  <div class="rng"><input type="range" id="st-trim" min="-200" max="200" value="0"><span class="v" id="st-trim-v">0</span></div>
  <label>Expo</label>
  <div class="rng"><input type="range" id="st-expo" min="0" max="100" value="0"><span class="v" id="st-expo-v">0.00</span></div>
  <label>Deadzone</label>
  <div class="rng"><input type="range" id="st-dz" min="0" max="30" value="2"><span class="v" id="st-dz-v">0.02</span></div>
  <label>Input Scale (Lenkübersetzung)</label>
  <div class="rng"><input type="range" id="st-scale" min="10" max="100" value="10" step="1"><span class="v" id="st-scale-v">1.0</span></div>
  <div class="row2">
    <div><label>Endpunkt Links</label>
      <div class="rng"><input type="range" id="st-epl" min="-100" max="0" value="-100"><span class="v" id="st-epl-v">-1.00</span></div>
    </div>
    <div><label>Endpunkt Rechts</label>
      <div class="rng"><input type="range" id="st-epr" min="0" max="100" value="100"><span class="v" id="st-epr-v">1.00</span></div>
    </div>
  </div>
  <div class="chk"><input type="checkbox" id="st-inv"><label for="st-inv">Invertieren</label></div>

  <div class="servo-out">
    <label>Servo-Output</label>
    <div class="servo-nums">
      <span>In: <span id="st-raw">—</span></span>
      <span>Out: <span id="st-out">—</span></span>
      <span>Puls: <span id="st-puls">—</span> µs</span>
    </div>
    <div class="servo-track"><div class="mid"></div><div class="fill" id="st-bar"></div></div>
  </div>
</div>

<!-- Throttle -->
<div class="card">
  <h2>⚡ Gas / Bremse</h2>
  <div class="row2">
    <div><label>Gas-Achse</label><select id="th-axis"><option value="">—</option></select></div>
    <div><label>Bremse-Achse</label><select id="th-brake"><option value="">— (keine) —</option></select></div>
  </div>

  <div class="row2">
    <div><label>GPIO</label><input type="number" id="th-gpio" value="19" min="0" max="27"></div>
    <div><label>Center (µs)</label><input type="number" id="th-center" value="1450"></div>
  </div>
  <div class="row2">
    <div><label>Min (µs)</label><input type="number" id="th-minp" value="500"></div>
    <div><label>Max (µs)</label><input type="number" id="th-maxp" value="2400"></div>
  </div>

  <label>Trim</label>
  <div class="rng"><input type="range" id="th-trim" min="-200" max="200" value="0"><span class="v" id="th-trim-v">0</span></div>
  <label>Expo</label>
  <div class="rng"><input type="range" id="th-expo" min="0" max="100" value="0"><span class="v" id="th-expo-v">0.00</span></div>
  <label>Deadzone</label>
  <div class="rng"><input type="range" id="th-dz" min="0" max="30" value="2"><span class="v" id="th-dz-v">0.02</span></div>
  <div class="row2">
    <div><label>Endpunkt Zurück</label>
      <div class="rng"><input type="range" id="th-epl" min="-100" max="0" value="-100"><span class="v" id="th-epl-v">-1.00</span></div>
    </div>
    <div><label>Endpunkt Vor</label>
      <div class="rng"><input type="range" id="th-epr" min="0" max="100" value="100"><span class="v" id="th-epr-v">1.00</span></div>
    </div>
  </div>
  <div class="chk"><input type="checkbox" id="th-inv"><label for="th-inv">Invertieren</label></div>

  <div class="servo-out">
    <label>Servo-Output</label>
    <div class="servo-nums">
      <span>In: <span id="th-raw">—</span></span>
      <span>Out: <span id="th-out">—</span></span>
      <span>Puls: <span id="th-puls">—</span> µs</span>
    </div>
    <div class="servo-track"><div class="mid"></div><div class="fill" id="th-bar"></div></div>
  </div>
</div>

<div class="card">
  <button class="btn-save" onclick="saveAll()">💾 Speichern</button>
  <div class="status" id="status"></div>
</div>
</div>

<script>
const P = {st: "steering", th: "throttle"};
let cfg = {}, axes = [], axCount = 0;

async function api(url, body) {
  const opts = body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {};
  return (await fetch(url, opts)).json();
}

// --- Init ---
async function init() {
  cfg = await api("/api/config");
  fillForm();
  await scanDevices();
  setInterval(poll, 80);
}

// --- Geräte ---
async function scanDevices() {
  const devs = await api("/api/devices");
  const sel = document.getElementById("sel-device");
  sel.innerHTML = '<option value="">— Lenkrad wählen —</option>';
  devs.forEach(d => {
    const o = document.createElement("option");
    o.value = d.path; o.textContent = d.name;
    if (d.path === cfg.input_device) { o.selected = true; axes = d.axes || []; fillAxisDropdowns(); }
    sel.appendChild(o);
  });
  sel.onchange = async () => {
    cfg.input_device = sel.value || null;
    const dev = devs.find(d => d.path === sel.value);
    axes = dev ? dev.axes || [] : [];
    fillAxisDropdowns();
    await api("/api/config", {input_device: cfg.input_device});
    status("Gerät gewählt");
  };
}

function fillAxisDropdowns() {
  ["st","th"].forEach(p => {
    const ch = P[p], sel = document.getElementById(`${p}-axis`);
    sel.innerHTML = '<option value="">— Achse wählen —</option>';
    axes.forEach(a => {
      const o = document.createElement("option");
      o.value = a.code; o.textContent = `Axis ${a.code} (${a.name})`;
      if (cfg[ch] && cfg[ch].input_axis === a.code) o.selected = true;
      sel.appendChild(o);
    });
    sel.onchange = async () => {
      const v = sel.value !== "" ? parseInt(sel.value) : null;
      cfg[ch].input_axis = v;
      await api("/api/config", {[ch]: {input_axis: v}});
      status(`${ch} → Axis ${v ?? "keine"}`);
    };
  });
  // Bremse-Achse für Throttle
  const brakeSel = document.getElementById("th-brake");
  brakeSel.innerHTML = '<option value="">— keine (nur Gas) —</option>';
  axes.forEach(a => {
    const o = document.createElement("option");
    o.value = a.code; o.textContent = `Axis ${a.code} (${a.name})`;
    if (cfg.throttle && cfg.throttle.input_axis_brake === a.code) o.selected = true;
    brakeSel.appendChild(o);
  });
  brakeSel.onchange = async () => {
    const v = brakeSel.value !== "" ? parseInt(brakeSel.value) : null;
    cfg.throttle.input_axis_brake = v;
    await api("/api/config", {throttle: {input_axis_brake: v}});
    status(`Bremse → Axis ${v ?? "keine"}`);
  };
}

// --- Live-Poll ---
async function poll() {
  try {
    const d = await api("/api/live");
    updateAxes(d.axes || {});
    updateServo(d.servo || {});
  } catch(e) {}
}

function updateAxes(data) {
  const mon = document.getElementById("axes-mon");
  const keys = Object.keys(data);
  if (!keys.length) { mon.innerHTML = '<span class="no-data">Keine Daten</span>'; return; }
  // DOM nur bei Achsen-Änderung neu bauen
  if (keys.length !== axCount) {
    axCount = keys.length;
    mon.innerHTML = keys.map(c => `<div class="ax" id="ax${c}">
      <span class="name">Axis ${c}</span><span class="val" id="av${c}">0</span>
      <div class="track"><div class="mid"></div><div class="fill" id="af${c}"></div><div class="cur" id="ac${c}"></div></div>
    </div>`).join("");
  }
  for (const [c, v] of Object.entries(data)) {
    const ve = document.getElementById(`av${c}`), fe = document.getElementById(`af${c}`), ce = document.getElementById(`ac${c}`);
    if (!ve) continue;
    ve.textContent = v.toFixed(2);
    const pct = ((v+1)/2)*100;
    fe.style.left = Math.min(pct,50)+"%"; fe.style.width = Math.abs(pct-50)+"%";
    fe.style.background = v >= 0 ? "#38bdf8" : "#f87171";
    ce.style.left = pct+"%";
  }
}

function updateServo(data) {
  ["st","th"].forEach(p => {
    const ch = P[p], d = data[ch];
    const raw = document.getElementById(`${p}-raw`), out = document.getElementById(`${p}-out`);
    const puls = document.getElementById(`${p}-puls`), bar = document.getElementById(`${p}-bar`);
    if (d) {
      raw.textContent = d.input_raw.toFixed(3);
      out.textContent = d.value.toFixed(3);
      puls.textContent = d.pulse;
      // Bar basiert auf Pulsweite — zeigt Trim-Effekt
      const s = cfg[ch] || {};
      const minP = s.min_pulse || 500, maxP = s.max_pulse || 2400;
      const pct = ((d.pulse - minP) / (maxP - minP)) * 100;
      const center = 50; // Mitte der Bar
      bar.style.left = Math.min(pct, center) + "%";
      bar.style.width = Math.max(Math.abs(pct - center), 0.5) + "%";
      bar.style.background = pct >= center ? "#38bdf8" : "#f87171";
    } else {
      raw.textContent = out.textContent = puls.textContent = "—";
      bar.style.width = "0";
    }
  });
}

// --- Form ---
function fillForm() {
  ["st","th"].forEach(p => {
    const s = cfg[P[p]];
    el(`${p}-gpio`).value = s.servo_gpio;
    el(`${p}-center`).value = s.center_pulse;
    el(`${p}-minp`).value = s.min_pulse;
    el(`${p}-maxp`).value = s.max_pulse;
    rng(`${p}-trim`, s.trim, v=>v);
    rng(`${p}-expo`, s.expo*100, v=>(v/100).toFixed(2));
    rng(`${p}-dz`, s.deadzone*100, v=>(v/100).toFixed(2));
    rng(`${p}-epl`, s.endpoint_low*100, v=>(v/100).toFixed(2));
    rng(`${p}-epr`, s.endpoint_high*100, v=>(v/100).toFixed(2));
    el(`${p}-inv`).checked = s.invert;
    // Live-Sync für Checkbox und Number-Inputs
    el(`${p}-inv`).onchange = syncConfig;
    [`${p}-gpio`,`${p}-center`,`${p}-minp`,`${p}-maxp`].forEach(id => {
      el(id).onchange = syncConfig;
    });
  });
  // Input Scale nur für Steering
  const stScale = cfg.steering.input_scale || 1.0;
  rng("st-scale", stScale * 10, v => (v/10).toFixed(1));
}

function el(id) { return document.getElementById(id); }
let _syncTimer = null;
function syncConfig() {
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(() => { cfg = gather(); api("/api/config", cfg); }, 100);
}
function rng(id, val, fmt) {
  const e = el(id); e.value = val; el(id+"-v").textContent = fmt(val);
  e.oninput = () => {
    el(id+"-v").textContent = fmt(+e.value);
    syncConfig();
  };
}

function gather() {
  const c = {input_device: cfg.input_device};
  ["st","th"].forEach(p => {
    const ch = P[p], ax = el(`${p}-axis`);
    c[ch] = {
      servo_gpio: +el(`${p}-gpio`).value,
      input_axis: ax.value !== "" ? +ax.value : null,
      trim: +el(`${p}-trim`).value,
      min_pulse: +el(`${p}-minp`).value,
      max_pulse: +el(`${p}-maxp`).value,
      center_pulse: +el(`${p}-center`).value,
      invert: el(`${p}-inv`).checked,
      expo: +el(`${p}-expo`).value / 100,
      deadzone: +el(`${p}-dz`).value / 100,
      endpoint_low: +el(`${p}-epl`).value / 100,
      endpoint_high: +el(`${p}-epr`).value / 100,
    };
  });
  // Input Scale nur für Steering
  c.steering.input_scale = +el("st-scale").value / 10;
  return c;
}

async function saveAll() {
  cfg = gather();
  await api("/api/config", cfg);
  status("✅ Gespeichert");
}

function status(msg) {
  const e = el("status"); e.textContent = msg;
  setTimeout(() => e.textContent = "", 2500);
}

init();
</script>
</body>
</html>
