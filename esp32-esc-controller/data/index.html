<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RC ESC Controller</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 16px;
        }
        
        h1 {
            text-align: center;
            font-size: 1.4em;
            margin-bottom: 16px;
            color: #00d4ff;
        }
        
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #16213e;
            border-radius: 8px;
            padding: 10px 16px;
            margin-bottom: 16px;
            font-size: 0.9em;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        
        .dot-connected { background: #00ff88; }
        .dot-disconnected { background: #ff4444; }
        .dot-armed { background: #00ff88; box-shadow: 0 0 8px #00ff88; }
        .dot-disarmed { background: #ffaa00; }
        
        .card {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }
        
        .card h2 {
            font-size: 1em;
            margin-bottom: 12px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* Platform Selector */
        .platform-select {
            width: 100%;
            padding: 10px;
            background: #0f3460;
            border: 1px solid #00d4ff44;
            border-radius: 6px;
            color: #eee;
            font-size: 1em;
            cursor: pointer;
        }
        
        .platform-select:focus {
            outline: none;
            border-color: #00d4ff;
        }
        
        /* Slider Controls */
        .control-group {
            margin-bottom: 20px;
        }
        
        .control-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9em;
        }
        
        .control-value {
            color: #00d4ff;
            font-weight: bold;
            font-family: monospace;
            font-size: 1.1em;
        }
        
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 40px;
            background: transparent;
            cursor: pointer;
        }
        
        input[type="range"]::-webkit-slider-track {
            height: 8px;
            background: #0f3460;
            border-radius: 4px;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 28px;
            height: 28px;
            background: #00d4ff;
            border-radius: 50%;
            margin-top: -10px;
            box-shadow: 0 2px 8px rgba(0, 212, 255, 0.4);
        }
        
        .slider-steering::-webkit-slider-track {
            background: linear-gradient(to right, #ff6b6b, #0f3460 45%, #00d4ff 50%, #0f3460 55%, #ff6b6b);
        }
        
        .slider-throttle::-webkit-slider-track {
            background: linear-gradient(to right, #ff6b6b, #0f3460 45%, #00ff88 50%, #0f3460 55%, #00ff88);
        }
        
        /* Buttons */
        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        
        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn:active {
            transform: scale(0.95);
        }
        
        .btn-arm {
            background: #00ff88;
            color: #1a1a2e;
        }
        
        .btn-arm:hover { background: #00cc6a; }
        
        .btn-disarm {
            background: #ff4444;
            color: #fff;
        }
        
        .btn-disarm:hover { background: #cc3333; }
        
        .btn-center {
            background: #0f3460;
            color: #00d4ff;
            border: 1px solid #00d4ff44;
        }
        
        .btn-center:hover { background: #1a4a80; }
        
        /* Visualization */
        .visual-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 20px;
        }
        
        .wheel-visual {
            width: 80px;
            height: 80px;
            border: 4px solid #00d4ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }
        
        .wheel-inner {
            width: 4px;
            height: 60px;
            background: #00d4ff;
            border-radius: 2px;
        }
        
        .throttle-bar {
            width: 30px;
            height: 120px;
            background: #0f3460;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }
        
        .throttle-fill {
            position: absolute;
            bottom: 50%;
            left: 0;
            width: 100%;
            background: #00ff88;
            transition: all 0.1s;
        }
        
        .throttle-fill.reverse {
            top: 50%;
            bottom: auto;
            background: #ff6b6b;
        }
        
        .throttle-center-line {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background: #aaa;
        }
        
        /* Log */
        .log {
            background: #0a0a1a;
            border-radius: 6px;
            padding: 10px;
            max-height: 120px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.8em;
            color: #888;
        }
        
        .log-entry { margin-bottom: 2px; }
        .log-entry.warn { color: #ffaa00; }
        .log-entry.error { color: #ff4444; }
        .log-entry.ok { color: #00ff88; }

        /* Pulse display */
        .pulse-display {
            display: flex;
            justify-content: space-around;
            margin-top: 12px;
            font-family: monospace;
            font-size: 0.85em;
        }
        
        .pulse-item {
            text-align: center;
        }
        
        .pulse-item .label { color: #888; }
        .pulse-item .value { color: #00d4ff; font-size: 1.2em; }
    </style>
</head>
<body>
    <h1>&#x1F3CE; RC ESC Controller</h1>
    
    <!-- Status Bar -->
    <div class="status-bar">
        <div>
            <span class="status-dot dot-disconnected" id="wsDot"></span>
            <span id="wsStatus">Verbinde...</span>
        </div>
        <div>
            <span class="status-dot dot-disarmed" id="armDot"></span>
            <span id="armStatus">Disarmed</span>
        </div>
    </div>
    
    <!-- Platform -->
    <div class="card">
        <h2>ESC Plattform</h2>
        <select class="platform-select" id="platformSelect">
            <option value="0">Traxxas (XL-5 / VXL)</option>
            <option value="1">Hobbywing (QuicRun)</option>
            <option value="2">Generic</option>
        </select>
    </div>
    
    <!-- Visual -->
    <div class="card">
        <h2>Live-Anzeige</h2>
        <div class="visual-container">
            <div class="wheel-visual" id="wheelVisual">
                <div class="wheel-inner"></div>
            </div>
            <div class="throttle-bar">
                <div class="throttle-center-line"></div>
                <div class="throttle-fill" id="throttleFill"></div>
            </div>
        </div>
        <div class="pulse-display">
            <div class="pulse-item">
                <div class="label">Lenkung</div>
                <div class="value" id="steeringPulse">1500 &micro;s</div>
            </div>
            <div class="pulse-item">
                <div class="label">Throttle</div>
                <div class="value" id="throttlePulse">1500 &micro;s</div>
            </div>
        </div>
    </div>
    
    <!-- Controls -->
    <div class="card">
        <h2>Steuerung</h2>
        
        <div class="control-group">
            <div class="control-label">
                <span>Lenkeinschlag</span>
                <span class="control-value" id="steeringValue">0</span>
            </div>
            <input type="range" class="slider-steering" id="steeringSlider" 
                   min="-1000" max="1000" value="0" step="1">
        </div>
        
        <div class="control-group">
            <div class="control-label">
                <span>Gas / Bremse</span>
                <span class="control-value" id="throttleValue">0</span>
            </div>
            <input type="range" class="slider-throttle" id="throttleSlider" 
                   min="-1000" max="1000" value="0" step="1">
        </div>
        
        <div class="btn-row">
            <button class="btn btn-center" id="btnCenter" aria-label="Zentrieren">Zentrieren</button>
        </div>
        
        <div class="btn-row">
            <button class="btn btn-arm" id="btnArm" aria-label="ESC Arm">ARM</button>
            <button class="btn btn-disarm" id="btnDisarm" aria-label="ESC Disarm">DISARM</button>
        </div>
    </div>
    
    <!-- Log -->
    <div class="card">
        <h2>Log</h2>
        <div class="log" id="logBox"></div>
    </div>

    <script>
        // ============================================================
        // WebSocket
        // ============================================================
        let ws = null;
        let reconnectTimer = null;
        
        function connectWS() {
            const host = window.location.hostname || '192.168.4.1';
            ws = new WebSocket(`ws://${host}/ws`);
            
            ws.onopen = () => {
                document.getElementById('wsDot').className = 'status-dot dot-connected';
                document.getElementById('wsStatus').textContent = 'Verbunden';
                log('WebSocket verbunden', 'ok');
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                }
            };
            
            ws.onclose = () => {
                document.getElementById('wsDot').className = 'status-dot dot-disconnected';
                document.getElementById('wsStatus').textContent = 'Getrennt';
                log('Verbindung verloren — Reconnect...', 'warn');
                reconnectTimer = setTimeout(connectWS, 2000);
            };
            
            ws.onerror = () => {
                log('WebSocket Fehler', 'error');
            };
            
            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    handleMessage(data);
                } catch (e) {
                    console.error('Parse error:', e);
                }
            };
        }
        
        function send(obj) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(obj));
            }
        }
        
        // ============================================================
        // Message Handler
        // ============================================================
        function handleMessage(data) {
            if (data.type === 'status') {
                updateArmStatus(data.armed);
                if (data.platform) {
                    log(`Plattform: ${data.platform}`, 'ok');
                }
                if (data.steering !== undefined) updateVisuals(data.steering, data.throttle);
            } else if (data.type === 'ack') {
                updateArmStatus(data.armed);
                updateVisuals(data.steering, data.throttle);
            } else if (data.type === 'log') {
                log(data.msg, '');
            } else if (data.type === 'failsafe') {
                log(`FAILSAFE: ${data.message}`, 'warn');
                document.getElementById('steeringSlider').value = 0;
                document.getElementById('throttleSlider').value = 0;
                updateVisuals(0, 0);
            }
        }
        
        function updateArmStatus(armed) {
            const dot = document.getElementById('armDot');
            const text = document.getElementById('armStatus');
            if (armed) {
                dot.className = 'status-dot dot-armed';
                text.textContent = 'ARMED';
            } else {
                dot.className = 'status-dot dot-disarmed';
                text.textContent = 'Disarmed';
            }
        }
        
        // ============================================================
        // Visuals
        // ============================================================
        function updateVisuals(steering, throttle) {
            // Lenkrad drehen
            const angle = (steering / 1000) * 45; // max 45°
            document.getElementById('wheelVisual').style.transform = `rotate(${angle}deg)`;
            
            // Throttle-Bar
            const fill = document.getElementById('throttleFill');
            if (throttle >= 0) {
                fill.className = 'throttle-fill';
                fill.style.height = `${(throttle / 1000) * 50}%`;
                fill.style.bottom = '50%';
                fill.style.top = 'auto';
            } else {
                fill.className = 'throttle-fill reverse';
                fill.style.height = `${(Math.abs(throttle) / 1000) * 50}%`;
                fill.style.top = '50%';
                fill.style.bottom = 'auto';
            }
            
            // Pulse-Werte berechnen (Anzeige)
            const steerPulse = Math.round(1500 + (steering / 1000) * 500);
            const throttlePulse = Math.round(1500 + (throttle / 1000) * 500);
            document.getElementById('steeringPulse').textContent = `${steerPulse} \u00B5s`;
            document.getElementById('throttlePulse').textContent = `${throttlePulse} \u00B5s`;
            
            // Wert-Anzeige
            document.getElementById('steeringValue').textContent = steering;
            document.getElementById('throttleValue').textContent = throttle;
        }
        
        // ============================================================
        // Controls
        // ============================================================
        const steeringSlider = document.getElementById('steeringSlider');
        const throttleSlider = document.getElementById('throttleSlider');
        
        // Slider Events (mit Throttling)
        let sendTimer = null;
        
        steeringSlider.addEventListener('input', () => {
            const val = parseInt(steeringSlider.value);
            updateVisuals(val, parseInt(throttleSlider.value));
            clearTimeout(sendTimer);
            sendTimer = setTimeout(() => {
                send({ cmd: 'steer', value: val });
            }, 16);
        });
        
        // Lenkung zurücksetzen bei Release
        steeringSlider.addEventListener('change', () => {
            // Optional: hier NICHT zurücksetzen, damit man den Einschlag halten kann
        });
        
        throttleSlider.addEventListener('input', () => {
            const val = parseInt(throttleSlider.value);
            updateVisuals(parseInt(steeringSlider.value), val);
            clearTimeout(sendTimer);
            sendTimer = setTimeout(() => {
                send({ cmd: 'throttle', value: val });
            }, 16);
        });
        
        // Throttle zurücksetzen bei Release (Sicherheit!)
        throttleSlider.addEventListener('mouseup', () => {
            throttleSlider.value = 0;
            updateVisuals(parseInt(steeringSlider.value), 0);
            send({ cmd: 'throttle', value: 0 });
        });
        
        throttleSlider.addEventListener('touchend', () => {
            throttleSlider.value = 0;
            updateVisuals(parseInt(steeringSlider.value), 0);
            send({ cmd: 'throttle', value: 0 });
        });
        
        // Buttons
        document.getElementById('btnCenter').addEventListener('click', () => {
            steeringSlider.value = 0;
            throttleSlider.value = 0;
            updateVisuals(0, 0);
            send({ cmd: 'steer', value: 0 });
            send({ cmd: 'throttle', value: 0 });
            log('Zentriert', 'ok');
        });
        
        document.getElementById('btnArm').addEventListener('click', () => {
            send({ cmd: 'arm' });
            log('ARM Befehl gesendet...', 'ok');
        });
        
        document.getElementById('btnDisarm').addEventListener('click', () => {
            send({ cmd: 'disarm' });
            throttleSlider.value = 0;
            steeringSlider.value = 0;
            updateVisuals(0, 0);
            log('DISARM', 'warn');
        });
        
        // Platform Select
        document.getElementById('platformSelect').addEventListener('change', (e) => {
            const val = parseInt(e.target.value);
            send({ cmd: 'platform', value: val });
            log(`Plattform gewechselt: ${e.target.options[e.target.selectedIndex].text}`, 'ok');
        });
        
        // ============================================================
        // Log
        // ============================================================
        function log(msg, cls = '') {
            const box = document.getElementById('logBox');
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry ${cls}`;
            entry.textContent = `[${time}] ${msg}`;
            box.appendChild(entry);
            box.scrollTop = box.scrollHeight;
            
            // Max 50 Einträge
            while (box.children.length > 50) {
                box.removeChild(box.firstChild);
            }
        }
        
        // ============================================================
        // Keyboard Controls (optional, für Desktop-Test)
        // ============================================================
        document.addEventListener('keydown', (e) => {
            const step = 100;
            switch (e.key) {
                case 'ArrowLeft':
                    steeringSlider.value = Math.max(-1000, parseInt(steeringSlider.value) - step);
                    steeringSlider.dispatchEvent(new Event('input'));
                    break;
                case 'ArrowRight':
                    steeringSlider.value = Math.min(1000, parseInt(steeringSlider.value) + step);
                    steeringSlider.dispatchEvent(new Event('input'));
                    break;
                case 'ArrowUp':
                    throttleSlider.value = Math.min(1000, parseInt(throttleSlider.value) + step);
                    throttleSlider.dispatchEvent(new Event('input'));
                    break;
                case 'ArrowDown':
                    throttleSlider.value = Math.max(-1000, parseInt(throttleSlider.value) - step);
                    throttleSlider.dispatchEvent(new Event('input'));
                    break;
                case ' ':
                    e.preventDefault();
                    throttleSlider.value = 0;
                    steeringSlider.value = 0;
                    updateVisuals(0, 0);
                    send({ cmd: 'steer', value: 0 });
                    send({ cmd: 'throttle', value: 0 });
                    break;
            }
        });
        
        // ============================================================
        // Init
        // ============================================================
        log('Starte Verbindung...');
        connectWS();
        updateVisuals(0, 0);
    </script>
</body>
</html>
